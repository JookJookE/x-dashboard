<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#4364F7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Glowing Ambient Light Orbs -->
  <circle cx="180" cy="140" r="220" fill="#0052D4" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1020" cy="520" r="240" fill="#4364F7" opacity="0.2" filter="url(#glow)"/>

  <!-- Main Card Glass Container -->
  <rect x="70" y="60" width="1060" height="555" rx="32" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Category Badge Container -->
  <rect x="120" y="115" width="420" height="58" rx="29" fill="url(#accentGrad)"/>
  <text x="150" y="152" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    💻  IT TECH INSIGHT
  </text>

  <!-- Main Title Line 1 -->
  <text x="120" y="260" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="44" font-weight="900" fill="#ffffff">
    A Powerful Bull
  </text>

  <!-- Main Title Line 2 -->
  <text x="120" y="330" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="44" font-weight="900" fill="#38ef7d">
    Case Is Emerging for ...
  </text>

  <!-- Bottom Divider Line -->
  <line x1="120" y1="465" x2="1020" y2="465" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Footer Brand Tag -->
  <text x="120" y="530" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="26" font-weight="bold" fill="#38ef7d">
    ⚡ JookJook Insight Report
  </text>

  <!-- Ticker Tags -->
  <text x="1020" y="530" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="24" font-weight="bold" fill="#94a3b8" text-anchor="end">
    $NVDA $AAPL #AI
  </text>
</svg>