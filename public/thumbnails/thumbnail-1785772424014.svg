<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#4364F7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Topic Specific Background Graphic (Candlestick / Stock Line / Chip Circuit) -->
  
      <!-- Microchip Circuit Grid Lines -->
      <path d="M 100 180 L 300 180 L 380 260 L 700 260 L 780 180 L 1100 180" fill="none" stroke="#6FB1FC" stroke-width="3" opacity="0.5"/>
      <path d="M 100 500 L 400 500 L 480 420 L 750 420 L 820 500 L 1100 500" fill="none" stroke="#6FB1FC" stroke-width="3" opacity="0.5"/>
      <circle cx="380" cy="260" r="6" fill="#6FB1FC" filter="url(#glow)"/>
      <circle cx="700" cy="260" r="6" fill="#6FB1FC" filter="url(#glow)"/>
      <circle cx="480" cy="420" r="6" fill="#6FB1FC" filter="url(#glow)"/>
      <!-- Center Microchip Wafer Icon Graphic -->
      <rect x="880" y="140" width="140" height="140" rx="20" fill="none" stroke="#6FB1FC" stroke-width="4" opacity="0.6" filter="url(#glow)"/>
      <rect x="910" y="170" width="80" height="80" rx="10" fill="#6FB1FC" opacity="0.3"/>
      <text x="950" y="222" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI</text>
    

  <!-- Glowing Ambient Light Orbs -->
  <circle cx="180" cy="140" r="220" fill="#0052D4" opacity="0.22" filter="url(#glow)"/>
  <circle cx="1020" cy="520" r="240" fill="#4364F7" opacity="0.18" filter="url(#glow)"/>

  <!-- Main Card Glass Container -->
  <rect x="70" y="60" width="1060" height="555" rx="32" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Category Badge Container -->
  <rect x="120" y="115" width="400" height="58" rx="29" fill="url(#accentGrad)"/>
  <text x="150" y="152" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    💻  AI & SEMICONDUCTOR TECH
  </text>

  <!-- Main Title Line 1 -->
  <text x="120" y="260" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="44" font-weight="900" fill="#ffffff">
    Hashdex to shut
  </text>

  <!-- Main Title Line 2 -->
  <text x="120" y="330" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="44" font-weight="900" fill="#6FB1FC">
    down $14.7M Bitcoin E...
  </text>

  <!-- Bottom Divider Line -->
  <line x1="120" y1="465" x2="1020" y2="465" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Footer Brand Tag -->
  <text x="120" y="530" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="26" font-weight="bold" fill="#6FB1FC">
    ⚡ JookJook Insight Report
  </text>

  <!-- Ticker Tags -->
  <text x="1020" y="530" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="24" font-weight="bold" fill="#94a3b8" text-anchor="end">
    $NVDA $AAPL #반도체
  </text>
</svg>