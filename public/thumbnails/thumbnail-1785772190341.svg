<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Glowing Orbs -->
  <circle cx="200" cy="150" r="180" fill="#11998e" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="220" fill="#38ef7d" opacity="0.2" filter="url(#glow)"/>

  <!-- Main Card Glass Container -->
  <rect x="80" y="70" width="1040" height="535" rx="32" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Top Category Badge -->
  <rect x="130" y="130" width="360" height="54" rx="27" fill="url(#accentGrad)"/>
  <text x="160" y="165" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    📈  STOCK MARKET INSIGHT
  </text>

  <!-- Main Title Line 1 -->
  <text x="130" y="270" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="44" font-weight="900" fill="#ffffff">
    “너도나도 국장 탈출?” 미국
  </text>

  <!-- Main Title Line 2 -->
  <text x="130" y="340" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="44" font-weight="900" fill="#38ef7d">
    주식 쓸어담는 개미…반도체 3배까지 ‘끝...
  </text>

  <!-- Bottom Divider Line -->
  <line x1="130" y1="460" x2="1010" y2="460" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Footer Brand Tag -->
  <text x="130" y="520" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="24" font-weight="bold" fill="#38ef7d">
    ⚡ JookJook Insight Report
  </text>

  <!-- Ticker Tags -->
  <text x="1010" y="520" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="bold" fill="#94a3b8" text-anchor="end">
    $NVDA $TSLA #미국주식
  </text>
</svg>